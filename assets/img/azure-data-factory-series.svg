    <text x="125" y="174" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Azure Data</text>
    <text x="125" y="214" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Factory</text>
  </g>
  <g transform="translate(900 170)">
    <rect x="0" y="0" width="210" height="170" rx="18" fill="#111827" stroke="#34d399" stroke-width="3"/>
    <text x="105" y="58" text-anchor="middle" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="31" font-weight="700">Targets</text>
