<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Azure Data Factory pipeline series</title>
  <desc id="desc">A stable local diagram for Azure Data Factory tutorial posts, showing data sources moving through orchestration and transformation into analytics storage.</desc>
  <rect width="1200" height="630" fill="#0b1220"/>
  <path d="M0 500C150 420 262 472 400 430C575 377 655 252 840 284C988 310 1060 401 1200 340V630H0Z" fill="#0f766e" opacity=".35"/>
  <path d="M0 160C172 92 297 162 452 133C612 103 705 23 878 70C1026 110 1112 188 1200 132V0H0Z" fill="#2563eb" opacity=".32"/>
  <g transform="translate(90 170)">
    <rect x="0" y="0" width="210" height="170" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
    <text x="105" y="58" text-anchor="middle" fill="#e5f4ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Sources</text>
    <text x="105" y="100" text-anchor="middle" fill="#9ccfe5" font-family="Arial, sans-serif" font-size="22">SQL</text>
    <text x="105" y="132" text-anchor="middle" fill="#9ccfe5" font-family="Arial, sans-serif" font-size="22">Files</text>
  </g>
